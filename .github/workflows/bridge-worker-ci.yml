name: Bridge & Worker CI

on:
  push:
    branches: [main]
    paths: ['bridge/**', 'worker/**', '.github/workflows/bridge-worker-ci.yml']
  pull_request:
    paths: ['bridge/**', 'worker/**', '.github/workflows/bridge-worker-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-worker-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run check

  check-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
